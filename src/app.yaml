runtime: python310
default_expiration: "7d"
automatic_scaling:
   max_instances: 20

env_variables:
   PYTHONHTTPSVERIFY: 1

handlers:

- url: /favicon.ico
  static_files: StaticFiles/img_files/intakeIcon.png
  upload: Static/img_files/intakeIcon.png

- url: /robots.txt
  static_files: StaticFiles/robots.txt
  upload: StaticFiles/robots.txt

- url: /sitemap.xml
  static_files: StaticFiles/sitemap.xml
  upload: StaticFiles/sitemap.xml
  
- url: /index.html
  static_files: StaticFiles/index.html
  upload: StaticFiles/index.html

- url: /txt_files 
  static_dir: StaticFiles/txt_files

- url: /img_files
  static_dir: StaticFiles/img_files